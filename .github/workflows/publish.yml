name: Build and publish KaLM R2 to Replicate

"on":
  workflow_dispatch:
    inputs:
      model:
        description: Model to build and publish
        required: true
        type: choice
        default: kalm-reranker-v1-nano-r2
        options:
          - kalm-reranker-v1-nano-r2
          - kalm-reranker-v1-small-r2
          - kalm-reranker-v1-large-r2
      replicate_owner:
        description: Replicate username or organization that owns the destination model
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: replicate-${{ inputs.replicate_owner }}-${{ inputs.model }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ETAG_TIMEOUT: "60"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
      HF_XET_CHUNK_CACHE_SIZE_BYTES: "0"
    steps:
      - name: Check out the inference projects
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate the selected model and publishing credentials
        id: target
        env:
          SELECTED_MODEL: ${{ inputs.model }}
          REPLICATE_OWNER: ${{ inputs.replicate_owner }}
          REPLICATE_CLI_AUTH_TOKEN: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          model = os.environ["SELECTED_MODEL"]
          owner = os.environ["REPLICATE_OWNER"].strip()
          models = json.loads(Path("models.json").read_text())["models"]
          if model not in models:
              raise SystemExit("Select one of the three supported KaLM R2 models.")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]*", owner):
              raise SystemExit("replicate_owner must be a valid Replicate username or organization.")
          if not os.environ.get("REPLICATE_CLI_AUTH_TOKEN"):
              raise SystemExit("Add the REPLICATE_CLI_AUTH_TOKEN repository secret from https://replicate.com/auth/token before running this workflow.")
          target = f"r8.im/{owner}/{model}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"project={model}\ntarget={target}\nowner={owner}\n")
          print(f"Destination: {target}")
          print(f"Hugging Face revision: {models[model]['revision']}")
          PY

      # This action only cleans the disposable GitHub-hosted runner.
      - name: Free disk space on the temporary runner
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: true
          swap-storage: false

      - name: Set up Python for downloading weights
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Check space for weights and Docker layers
        env:
          SELECTED_MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          model = json.loads(Path("models.json").read_text())["models"][os.environ["SELECTED_MODEL"]]
          download_size = sum(asset["size"] for asset in model["files"].values() if asset["download"])
          # Reserve room for the workspace, build layers, image export and CUDA dependencies.
          required = 3 * download_size + 14 * 1024**3
          available = shutil.disk_usage(".").free
          print(f"Available disk: {available / 1024**3:.1f} GiB; estimated build budget: {required / 1024**3:.1f} GiB")
          if available < required:
              raise SystemExit("Insufficient disk space for this model. Use a runner with more free storage; no weights have been downloaded.")
          PY

      - name: Install the Hugging Face download client
        run: python -m pip install --no-cache-dir "huggingface-hub==1.8.0"

      - name: Download and verify the selected model
        env:
          SELECTED_MODEL: ${{ inputs.model }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HOME: ${{ runner.temp }}/huggingface
          HF_ENDPOINT: https://huggingface.co
        run: python scripts/prepare_weights.py "$SELECTED_MODEL"

      - name: Set up Cog and log in to Replicate
        uses: replicate/setup-cog@8a5fea3c1818b6950dcf8027285f5a9b447c0c4a # v2
        with:
          cog-version: v0.23.1
          install-cuda: false
          token: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}

      - name: Build and push the selected model
        working-directory: ${{ steps.target.outputs.project }}
        env:
          REPLICATE_TARGET: ${{ steps.target.outputs.target }}
        run: cog push "$REPLICATE_TARGET" --separate-weights

      - name: Show the published model
        env:
          REPLICATE_OWNER: ${{ steps.target.outputs.owner }}
          SELECTED_MODEL: ${{ steps.target.outputs.project }}
        run: |
          printf 'Published model: https://replicate.com/%s/%s\n' "$REPLICATE_OWNER" "$SELECTED_MODEL" >> "$GITHUB_STEP_SUMMARY"
